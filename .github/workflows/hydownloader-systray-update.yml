name: Hydownloader-systray Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-hydownloader-systray:
    name: "Update Hydownloader-systray"
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Required by actions/checkout.
      id-token: write # Required by Magic Nix Cache.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Determine current version
        run: echo "PREV_VERSION=$(nix eval .#hydownloader-systray.version --raw)" >> "$GITHUB_ENV"
      - name: Run nix-update
        run: nix run nixpkgs#nix-update -- --flake -u hydownloader-systray
      - name: Determine new version
        run: echo "NEXT_VERSION=$(nix eval .#hydownloader-systray.version --raw)" >> "$GITHUB_ENV"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create a pull request
        run: |-
          create_or_update_pr() {
            local branch="$1"
            local title="$2"
            local body="${3:-}"
            local base="${4:-master}"
            local pr_num
            pr_num=$(gh pr list --head "$branch" --json number -q '.[0].number // empty')
            if [ -z "$pr_num" ]; then
              gh pr create --title "$title" --body "$body" --base "$base" --head "$branch"
            else
              gh pr edit "$pr_num" --title "$title" --body "$body"
            fi
          }
          git config --local user.name "${APP_SLUG}[bot]"
          git config --local user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git checkout -B hydownloader-systray-auto-update
            git commit -am "hydownloader-systray: $PREV_VERSION -> $NEXT_VERSION"
            gh auth setup-git
            git push --force origin hydownloader-systray-auto-update
            create_or_update_pr \
              hydownloader-systray-auto-update \
              "hydownloader-systray: $PREV_VERSION -> $NEXT_VERSION" \
              "Update hydownloader-systray from $PREV_VERSION to $NEXT_VERSION."
          fi
        env:
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
